<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .page {
            max-width: 850px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.07);
        }

        .section-title {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            color: #1f2937;
            outline: none;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .score-note {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
        }

        .submit-section {
            margin-top: 30px;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            text-align: center;
        }

        .result-title {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 8px;
        }

        .result-score {
            font-size: 32px;
            font-weight: 700;
            color: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #2563eb;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="header">
            <h1>Student Performance Prediction</h1>
            <p>
                Enter the student's details and academic scores
                to predict the mathematics score.
            </p>
        </div>

        <div class="card">

            <div class="section-title">
                Student Information
            </div>

            <form action="{{ url_for('predict_datapoint') }}" method="post">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Gender</label>

                        <select name="gender" required>
                            <option selected disabled value="">
                                Select gender
                            </option>

                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Race / Ethnicity</label>

                        <select name="ethnicity" required>
                            <option selected disabled value="">
                                Select group
                            </option>

                            <option value="group A">Group A</option>
                            <option value="group B">Group B</option>
                            <option value="group C">Group C</option>
                            <option value="group D">Group D</option>
                            <option value="group E">Group E</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Parental Level of Education</label>

                        <select
                            name="parental_level_of_education"
                            required
                        >
                            <option selected disabled value="">
                                Select education level
                            </option>

                            <option value="associate's degree">
                                Associate's degree
                            </option>

                            <option value="bachelor's degree">
                                Bachelor's degree
                            </option>

                            <option value="high school">
                                High school
                            </option>

                            <option value="master's degree">
                                Master's degree
                            </option>

                            <option value="some college">
                                Some college
                            </option>

                            <option value="some high school">
                                Some high school
                            </option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Lunch Type</label>

                        <select name="lunch" required>
                            <option selected disabled value="">
                                Select lunch type
                            </option>

                            <option value="standard">
                                Standard
                            </option>

                            <option value="free/reduced">
                                Free / Reduced
                            </option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Test Preparation Course</label>

                        <select
                            name="test_preparation_course"
                            required
                        >
                            <option selected disabled value="">
                                Select course status
                            </option>

                            <option value="none">None</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Reading Score</label>

                        <input
                            type="number"
                            name="reading_score"
                            min="0"
                            max="100"
                            placeholder="Enter score"
                            required
                        >

                        <span class="score-note">
                            Score between 0 and 100
                        </span>
                    </div>


                    <div class="form-group">
                        <label>Writing Score</label>

                        <input
                            type="number"
                            name="writing_score"
                            min="0"
                            max="100"
                            placeholder="Enter score"
                            required
                        >

                        <span class="score-note">
                            Score between 0 and 100
                        </span>
                    </div>

                </div>


                <div class="submit-section">

                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Predict Mathematics Score
                    </button>

                </div>

            </form>


            {% if results is not none %}

            <div class="result">

                <div class="result-title">
                    Predicted Mathematics Score
                </div>

                <div class="result-score">
                    {{ results }}
                </div>

            </div>

            {% endif %}


            <a
                href="{{ url_for('index') }}"
                class="back-link"
            >
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
